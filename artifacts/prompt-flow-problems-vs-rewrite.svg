  <text x="545" y="450" class="heading">Problems input</text>
  <text x="545" y="482" class="file">alert-context.service.ts</text>
  <text x="545" y="518" class="body">Compact page/alert payload JSON</text>

  <rect x="205" y="595" width="590" height="135" rx="13" class="problem" />
  <text x="235" y="632" class="heading">Generic message composer</text>
  <text x="235" y="664" class="file">prompt.service.ts</text>
  <text x="235" y="698" class="body">composeMessages(config, content)</text>
  <text x="235" y="721" class="small">composePrompt() remains byte-identical</text>
  <path d="M282 380V575H390V595" class="blue-line" />
  <path d="M718 380V575H610V595" class="blue-line" />
  <path d="M282 550V575" class="blue-line" />
  <path d="M718 550V575" class="blue-line" />

  <!-- Rewrite sources -->
  <rect x="1085" y="215" width="395" height="165" rx="13" class="rewrite" />
  <text x="1110" y="250" class="heading">PromptConfig entry point</text>
  <text x="1110" y="282" class="file">page.prompts.ts</text>
  <text x="1110" y="318" class="body">PagePrompts.AlertRewrite</text>
  <text x="1110" y="348" class="small">role · output · pipeline reference</text>

  <rect x="1520" y="215" width="395" height="210" rx="13" class="rewrite" />
  <text x="1545" y="250" class="heading">Alert-specific pipeline</text>
  <text x="1545" y="282" class="file">alert-rewrite.prompt.ts</text>
  <text x="1545" y="318" class="body">Base rules · example variants</text>
  <text x="1545" y="350" class="body">Schemas · conditions · retry rules</text>
  <text x="1545" y="388" class="small">Typed by prompt.model.ts</text>

  <rect x="1085" y="460" width="395" height="175" rx="13" class="source" />
  <text x="1110" y="495" class="heading">Separate shared sources</text>
  <text x="1110" y="527" class="file">canada-ca-style.prompt.ts</text>
  <text x="1110" y="557" class="file">link-writing.prompt.ts</text>
  <text x="1110" y="587" class="file">cra-terminology.prompt.ts</text>
  <text x="1110" y="617" class="file">alert-rewrite.examples.ts</text>

  <rect x="1520" y="460" width="395" height="175" rx="13" class="runtime" />
  <text x="1545" y="495" class="heading">Per-alert inputs</text>
  <text x="1545" y="527" class="file">alert-rewrite-orchestrator.service.ts</text>
  <text x="1545" y="563" class="body">Selected issues · plan · original HTML</text>
  <text x="1545" y="595" class="body">Link manifest · compact context</text>
  <text x="1545" y="621" class="small">One alert at a time</text>

  <rect x="1205" y="670" width="590" height="105" rx="13" class="rewrite" />
  <text x="1235" y="707" class="heading">Custom message assembler</text>
  <text x="1235" y="739" class="file">alert-rewrite.service.ts</text>
  <text x="1235" y="765" class="small">buildAlertRewriteMessages(...)</text>
  <path d="M1282 380V650H1380V670" class="green-line" />
  <path d="M1718 425V650H1620V670" class="green-line" />
  <path d="M1282 635V650" class="green-line" />
  <path d="M1718 635V650" class="green-line" />

  <!-- Shared backbone -->
  <text x="60" y="835" class="lane" fill="var(--shared)">Shared message and OpenRouter backbone</text>
  <rect x="180" y="870" width="390" height="135" rx="13" class="shared" />
  <text x="375" y="910" text-anchor="middle" class="heading">ChatMessage[]</text>
  <text x="375" y="945" text-anchor="middle" class="file">prompt.model.ts</text>
  <text x="375" y="976" text-anchor="middle" class="small">system + user messages</text>

  <rect x="655" y="870" width="390" height="135" rx="13" class="shared" />
  <text x="850" y="910" text-anchor="middle" class="heading">sendMessages()</text>
  <text x="850" y="945" text-anchor="middle" class="file">openrouter.service.ts</text>
  <text x="850" y="976" text-anchor="middle" class="small">Extracts system and user content</text>

  <rect x="1130" y="870" width="390" height="135" rx="13" class="shared" />
  <text x="1325" y="910" text-anchor="middle" class="heading">sendRawPrompt()</text>
  <text x="1325" y="945" text-anchor="middle" class="file">openrouter.service.ts</text>
  <text x="1325" y="976" text-anchor="middle" class="small">Models · fallbacks · state · HTTP</text>

  <rect x="1605" y="870" width="260" height="135" rx="13" class="shared" />
  <text x="1735" y="925" text-anchor="middle" class="heading">OpenRouter model</text>
  <text x="1735" y="960" text-anchor="middle" class="small">Same transport</text>

  <path d="M500 730V820H375V870" class="blue-line" />
  <path d="M1500 775V820H375V870" class="green-line" />
  <path d="M570 938H655" class="line" />
  <path d="M1045 938H1130" class="line" />
  <path d="M1520 938H1605" class="line" />

  <!-- Response branches -->
  <text x="60" y="1075" class="lane" fill="var(--shared)">Domain-specific response handling remains separate</text>
  <path d="M1735 1005V1040H500V1110" class="blue-line" />
  <path d="M1735 1005V1040H1500V1110" class="green-line" />

  <rect x="125" y="1110" width="750" height="225" rx="14" class="problem" />
  <text x="155" y="1150" class="heading">Problems response: one call for the page</text>
  <text x="155" y="1182" class="file">alert.service.ts</text>
  <text x="155" y="1220" class="body">Parse and validate issue-report JSON</text>
  <text x="155" y="1252" class="body">Normalize severity · add placeholders · cache report</text>
  <text x="155" y="1284" class="body">Display issues and capture user selections</text>
  <text x="155" y="1314" class="small">Output: selected issue objects for Rewrite</text>

  <rect x="1090" y="1110" width="430" height="225" rx="14" class="rewrite" />
  <text x="1120" y="1150" class="heading">Rewrite response: per alert</text>
  <text x="1120" y="1182" class="file">alert-rewrite-orchestrator.service.ts</text>
  <text x="1120" y="1220" class="body">Parse replacement HTML</text>
  <text x="1120" y="1252" class="body">Run HTML, link, and copy guards</text>
  <text x="1120" y="1284" class="body">Track model and timing</text>

