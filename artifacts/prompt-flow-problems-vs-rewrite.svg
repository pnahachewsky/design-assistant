  <rect x="1045" y="125" width="910" height="650" rx="18" class="panel" />
  <text x="85" y="178" class="lane" fill="var(--blue)">Problems prompt construction</text>
  <text x="1085" y="178" class="lane" fill="var(--green)">Rewrite prompt construction</text>

