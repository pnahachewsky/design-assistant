  <rect x="520" y="215" width="395" height="165" rx="13" class="source" />
  <text x="545" y="250" class="heading">Shared fragments</text>
  <text x="545" y="282" class="file">shared.prompts.ts</text>
  <text x="545" y="318" class="body">RoleFragment · OutputFragment</text>
