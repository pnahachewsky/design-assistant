<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1500" viewBox="0 0 2000 1500" role="img" aria-labelledby="title desc">
  <title id="title">AWS-AIDA prompt flows: Problems and Rewrite</title>
  <desc id="desc">Problems and Rewrite build messages differently, converge on the same ChatMessage and OpenRouter transport, then separate again for response handling.</desc>
  <defs>
    <style>
      :root { --bg:#fff; --fg:#172033; --muted:#526079; --border:#cbd5e1; --panel:#f8fafc; --blue:#1d4ed8; --blue-soft:#eaf1ff; --green:#047857; --green-soft:#e9f8f2; --purple:#7c3aed; --purple-soft:#f3edff; --orange:#b45309; --orange-soft:#fff4df; --red:#9f1239; --red-soft:#fff0f4; --shared:#334155; --shared-soft:#eef2f7; }
      @media (prefers-color-scheme: dark) { :root { --bg:#111827; --fg:#f3f4f6; --muted:#cbd5e1; --border:#475569; --panel:#1f2937; --blue:#93b4ff; --blue-soft:#172554; --green:#6ee7b7; --green-soft:#073b31; --purple:#c4b5fd; --purple-soft:#2e1d57; --orange:#fbbf77; --orange-soft:#4a2b08; --red:#fda4af; --red-soft:#4c1023; --shared:#cbd5e1; --shared-soft:#273449; } }
      text { font-family:Arial,Helvetica,sans-serif; fill:var(--fg); }
      .title { font-size:38px; font-weight:500; }
      .subtitle { font-size:22px; fill:var(--muted); }
      .lane { font-size:29px; font-weight:500; }
      .heading { font-size:21px; font-weight:500; }
      .body { font-size:18px; }
      .small { font-size:16px; fill:var(--muted); }
      .legend-label { font-size:15px; }
      .file { font:500 16px Consolas,"Courier New",monospace; }
      .panel { fill:var(--panel); stroke:var(--border); stroke-width:2; }
      .problem { fill:var(--blue-soft); stroke:var(--blue); stroke-width:2; }
      .rewrite { fill:var(--green-soft); stroke:var(--green); stroke-width:2; }
      .source { fill:var(--purple-soft); stroke:var(--purple); stroke-width:2; }
      .runtime { fill:var(--orange-soft); stroke:var(--orange); stroke-width:2; }
      .shared { fill:var(--shared-soft); stroke:var(--shared); stroke-width:2.5; }
      .decision { fill:var(--red-soft); stroke:var(--red); stroke-width:2; }
      .line { fill:none; stroke:var(--shared); stroke-width:3; marker-end:url(#arrow); }
      .blue-line { fill:none; stroke:var(--blue); stroke-width:3; marker-end:url(#blue-arrow); }
      .green-line { fill:none; stroke:var(--green); stroke-width:3; marker-end:url(#green-arrow); }
      .retry-line { fill:none; stroke:var(--red); stroke-width:3; stroke-dasharray:10 7; marker-end:url(#red-arrow); }
      .dependency { fill:none; stroke:var(--shared); stroke-width:3; stroke-dasharray:9 7; marker-end:url(#arrow); }
      .divider { stroke:var(--border); stroke-width:2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--shared)" /></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--blue)" /></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--green)" /></marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--red)" /></marker>
  </defs>

  <rect width="2000" height="1500" fill="var(--bg)" />
  <text x="60" y="58" class="title">AWS-AIDA prompt flows</text>
  <text x="60" y="94" class="subtitle">Different prompt construction, one shared message and transport backbone</text>

  <!-- Legend -->
  <text x="1045" y="24" class="small">Legend</text>
  <rect x="1045" y="35" width="18" height="18" rx="4" class="problem" />
  <text x="1073" y="50" class="legend-label">Problems</text>
