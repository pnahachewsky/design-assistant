  <rect x="85" y="415" width="395" height="135" rx="13" class="source" />
  <text x="110" y="450" class="heading">Analysis instructions</text>
  <text x="110" y="482" class="file">reference.prompt.ts</text>
  <text x="110" y="518" class="body">AlertIssuesInstructions</text>

